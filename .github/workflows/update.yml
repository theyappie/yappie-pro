name: update-feed
on:
  # Normally started by the "tick" workflow about every 10 minutes (tick.yml), or by hand from the Actions tab.
  # The schedule below is a second, independent trigger for the case where GitHub is late with tick's schedule; the "gate" job skips it when an update began in the last 7 minutes.
  schedule: [{ cron: "17,47 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency: update-feed
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "skip=false" >> "$GITHUB_OUTPUT"
          [ "$GITHUB_EVENT_NAME" = "schedule" ] || exit 0
          created=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update.yml --limit 5 --json databaseId,createdAt --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0] // empty | .createdAt")
          [ -n "$created" ] || exit 0
          age=$(( $(date +%s) - $(date -d "$created" +%s) ))
          echo "The previous update began $age seconds ago."
          if [ "$age" -lt 420 ]; then echo "Too soon; skipping this scheduled run."; echo "skip=true" > "$GITHUB_OUTPUT"; fi
  update:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Collect news and policy records
        run: node scripts/fetch.mjs
        env:
          # optional: one free api.data.gov key (api.congress.gov/sign-up) for Congress.gov, Regulations.gov and GovInfo; without it the Policy tab skips those three
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      - run: node scripts/build-outputs.mjs
      - name: Commit feed
        run: |
          git config user.name "yappie-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "feed: $(date -u +%FT%TZ)"
          # The admin dashboard saves its decisions to data/admin.json while this job runs, so a push can be refused. Take the newer files and push again.
          for try in 1 2 3 4 5; do
            git push && exit 0
            echo "Push refused (a change was saved in the meantime); trying again ($try of 5)."
            sleep $((try * 3))
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          echo "Could not push after 5 tries."; exit 1
