<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Log in · The Yappie Pro admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a67f1'/%3E%3Cpath d='M9 8l7 9 7-9M16 17v8' stroke='%23fff' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style nonce="{{NONCE}}">
:root{--bg:#faf9f5;--pn:#fff;--tx:#111525;--dm:#5e5e5e;--ln:#dee2e6;--ac:#0a67f1;--bt:#fff;--err:#b3261e;--errbg:#fdecea;--warn-bg:#fdeccb;--warn-tx:#5a3a00}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e1a;--pn:#111525;--tx:#e9ecf5;--dm:#9aa3bd;--ln:#232a45;--ac:#4d94ff;--bt:#0b0e1a;--err:#ff8a80;--errbg:#3a1613;--warn-bg:#3a2a0b;--warn-tx:#f3d9a4}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;min-height:100vh}
main{width:100%;max-width:400px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:32px 28px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(17,21,37,.06)}
.mark{width:44px;height:44px;border-radius:10px;background:var(--ac);display:grid;place-items:center;margin-bottom:18px}
.mark svg{width:26px;height:26px}
h1{font-size:22px;line-height:1.25;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 24px;color:var(--dm);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field{position:relative}
input{width:100%;font:inherit;padding:11px 74px 11px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx)}
input:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:1px;border-color:var(--ac)}
.show{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:13px;font-weight:600;color:var(--ac);background:none;border:0;padding:6px 8px;border-radius:6px;cursor:pointer}
.show:focus-visible{outline:2px solid var(--ac)}
button.go{margin-top:18px;width:100%;font:inherit;font-weight:650;padding:12px;border:0;border-radius:9px;background:var(--ac);color:var(--bt);cursor:pointer}
button.go:disabled{opacity:.6;cursor:default}
button.go:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:2px}
.msg{margin:0 0 16px;padding:10px 12px;border-radius:9px;font-size:14px}
.msg[hidden]{display:none}
.err{background:var(--errbg);color:var(--err)}
.warn{background:var(--warn-bg);color:var(--warn-tx)}
.foot{margin:18px 4px 0;text-align:center;font-size:12.5px;color:var(--dm)}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8l7 9 7-9M16 17v8"/></svg></div>
    <h1>The Yappie Pro admin</h1>
    <p class="sub">Log in to approve, edit, retag or delete what is on the site.</p>
    <div class="msg warn" id="setup" role="alert">{{SETUP}}</div>
    <div class="msg err" id="err" role="alert" hidden></div>
    <form id="f" method="post" action="/api/login" autocomplete="on">
      <input type="text" name="username" value="admin" autocomplete="username" hidden>
      <label for="pw">Password</label>
      <div class="field">
        <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus maxlength="500">
        <button type="button" class="show" id="show" aria-controls="pw" aria-pressed="false">Show</button>
      </div>
      <button class="go" id="go" type="submit">Log in</button>
    </form>
  </div>
  <p class="foot">This page is private. Too many wrong passwords lock the address for 15 minutes.</p>
</main>
<script nonce="{{NONCE}}">
(() => {
  const $ = id => document.getElementById(id), f = $("f"), pw = $("pw"), err = $("err"), go = $("go"), setup = $("setup");
  if (!setup.textContent.trim()) setup.hidden = true;
  $("show").addEventListener("click", e => { const on = pw.type === "password"; pw.type = on ? "text" : "password"; e.target.textContent = on ? "Hide" : "Show"; e.target.setAttribute("aria-pressed", String(on)); pw.focus(); });
  f.addEventListener("submit", async ev => {
    ev.preventDefault(); err.hidden = true; go.disabled = true; go.textContent = "Checking…";
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: pw.value }), credentials: "same-origin" });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok) { location.replace("/"); return; }
      err.textContent = j.error || "Could not log in. Try again."; err.hidden = false; pw.select();
    } catch { err.textContent = "Could not reach the server. Check your connection and try again."; err.hidden = false; }
    go.disabled = false; go.textContent = "Log in";
  });
})();
</script>
</body>
</html>
