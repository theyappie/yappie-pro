name: daily-digest
# Weekday morning brief. Writes data/digest/latest.html and, if the secrets below exist, emails it (recipients are BCC'd).
on:
  schedule: [{ cron: "30 12 * * 1-5" }]   # 12:30 UTC = 8:30am Eastern in summer, 7:30am in winter
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-digest
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node scripts/digest.mjs
        env:
          SMTP_URL: ${{ secrets.SMTP_URL }}          # e.g. smtps://user:app-password@smtp.gmail.com:465
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}    # e.g. brief@yourorg.org
          DIGEST_TO: ${{ secrets.DIGEST_TO }}        # comma-separated recipients
          SITE_URL: ${{ vars.SITE_URL }}             # your public portal URL (optional)
          DIGEST_TOPICS: ${{ vars.DIGEST_TOPICS }}   # optional, e.g. IMMIGRATION,ELECTIONS
      - name: Commit digest
        run: |
          git config user.name "yappie-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "digest: $(date -u +%F)" && git push)
