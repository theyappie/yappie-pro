name: update-feed
on:
  # Normally started by the "tick" workflow about every 10 minutes (tick.yml), or by hand from the Actions tab.
  # The schedule below is a second, independent trigger for the case where GitHub is late with tick's schedule; the "gate" job skips it when an update began in the last 7 minutes.
  schedule: [{ cron: "17,47 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency: update-feed
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "skip=false" >> "$GITHUB_OUTPUT"
          [ "$GITHUB_EVENT_NAME" = "schedule" ] || exit 0
          created=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update.yml --limit 5 --json databaseId,createdAt --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0] // empty | .createdAt")
          [ -n "$created" ] || exit 0
          age=$(( $(date +%s) - $(date -d "$created" +%s) ))
          echo "The previous update began $age seconds ago."
          if [ "$age" -lt 420 ]; then echo "Too soon; skipping this scheduled run."; echo "skip=true" > "$GITHUB_OUTPUT"; fi
  update:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The admin dashboard keeps its decisions (admin.json) and the stories waiting for approval (pending.json) in a separate PRIVATE repository, because this one is public and published.
      # ADMIN_DATA_TOKEN: an Actions secret, a fine-grained token with Contents read and write on that repository. Setup: tools/admin/README.md. Without it the dashboard is not in use.
      ADMIN_DATA_TOKEN: ${{ secrets.ADMIN_DATA_TOKEN }}
      ADMIN_DATA_REPO: ${{ vars.ADMIN_DATA_REPO || 'theyappie/yappie-pro-admin' }}
    steps:
      # The newest commit of the branch, not the one that was current when this run was triggered: a run that waited in the queue behind another update would otherwise start from out-of-date data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Admin dashboard is not set up
        if: env.ADMIN_DATA_TOKEN == ''
        run: echo "::notice::ADMIN_DATA_TOKEN is not set, so decisions made in the admin dashboard are not applied. See tools/admin/README.md."
      - name: Check that the admin data repository is private
        if: env.ADMIN_DATA_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.ADMIN_DATA_TOKEN }}
        run: |
          set -eu
          private=$(gh api "repos/$ADMIN_DATA_REPO" --jq .private) || { echo "::error::The admin data repository $ADMIN_DATA_REPO was not found, or ADMIN_DATA_TOKEN cannot see it."; exit 1; }
          if [ "$private" != "true" ]; then echo "::error::$ADMIN_DATA_REPO is not private. Make it private (Settings, Danger Zone, Change visibility); stories waiting for approval would otherwise be public."; exit 1; fi
      - name: Get the admin data
        if: env.ADMIN_DATA_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ADMIN_DATA_REPO }}
          token: ${{ secrets.ADMIN_DATA_TOKEN }}
          path: admin-data
      - name: Collect news and policy records
        run: node scripts/fetch.mjs
        env:
          # when the admin data was fetched, the collector reads and writes it there; otherwise next to the feed
          ADMIN_DIR: ${{ secrets.ADMIN_DATA_TOKEN != '' && 'admin-data' || '' }}
          # optional: one free api.data.gov key (api.congress.gov/sign-up) for Congress.gov, Regulations.gov and GovInfo; without it the Policy tab skips those three
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      - run: node scripts/build-outputs.mjs
      - name: Commit feed
        run: |
          git config user.name "yappie-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "feed: $(date -u +%FT%TZ)"
          # This push is refused if something else was pushed to the branch in the meantime. Every file in data/ is rebuilt from scratch on each run, so where both sides changed
          # one, keep this run's version. If that cannot be done, drop this run: the next one (within minutes) rebuilds everything.
          for try in 1 2 3 4 5; do
            git push && exit 0
            echo "Push refused (something was pushed in the meantime); trying again ($try of 5)."
            sleep $((try * 3))
            git fetch -q origin "$GITHUB_REF_NAME"
            if ! git rebase -X theirs FETCH_HEAD; then
              git rebase --abort || true
              git reset -q --hard FETCH_HEAD
              echo "Could not combine this run with the newer data; skipping it. The next update starts from the newer data."
              exit 0
            fi
          done
          echo "Could not push after 5 tries."; exit 1
      - name: Save the waiting list to the private repository
        if: env.ADMIN_DATA_TOKEN != ''
        working-directory: admin-data
        run: |
          git config user.name "yappie-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "pending: $(date -u +%FT%TZ)"
          # The dashboard saves admin.json to this repository at any moment, so a push can be refused. This job only ever writes pending.json here, so keep this run's version of it.
          for try in 1 2 3 4 5; do
            git push && exit 0
            echo "Push refused (a change was saved in the meantime); trying again ($try of 5)."
            sleep $((try * 3))
            git fetch -q origin
            if ! git rebase -X theirs '@{u}'; then git rebase --abort || true; git reset -q --hard '@{u}'; echo "Could not combine; skipping. The next update saves the waiting list again."; exit 0; fi
          done
          echo "Could not push after 5 tries."; exit 1
